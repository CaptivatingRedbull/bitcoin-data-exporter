# TA-btc-parser-parsing/default/props.conf
#
# Deploy on whichever tier actually PARSES these events, not on the
# Universal Forwarder:
#   - Splunk Cloud (test): install as a private app via Settings > Apps >
#     Install app from file (self-service). Cloud runs parsing on its
#     managed indexing tier, which you cannot reach by any other means.
#   - Splunk Enterprise (prod): push to the indexer(s) - directly under
#     etc/apps on a standalone indexer, or via the cluster manager's
#     deployer onto an indexer cluster.
# A Universal Forwarder never parses (it forwards raw, unparsed data), so
# an INDEXED_EXTRACTIONS/TIMESTAMP_FIELDS stanza sitting only on the UF
# has no effect - see docs/10-splunk-integration-und-feldkonzept.md,
# section 2.
#
# Every sourcetype below uses index-time CSV field extraction
# (INDEXED_EXTRACTIONS = csv): each header column becomes a full Splunk
# field. That mirrors a deliberate choice already made one layer down, in
# btc_parser_app itself - every column that makes it into these CSVs was
# already selected as analytically worthwhile (see the "Bewusst nicht
# exportiert" notes in docs chapters 4.9-4.12); re-filtering at the Splunk
# layer would just repeat that decision, not improve it. See
# docs/10-splunk-integration-und-feldkonzept.md for the full field-level
# reasoning (which directories are excluded entirely, why hash/ID fields
# stay indexed despite high cardinality, why TRUNCATE is left at default).

[btc:blocks]
INDEXED_EXTRACTIONS = csv
HEADER_FIELD_LINE_NUMBER = 1
FIELD_DELIMITER = ,
FIELD_QUOTE = "
TIMESTAMP_FIELDS = time
TIME_FORMAT = %s
TZ = UTC
SHOULD_LINEMERGE = false
category = Structured
description = btc_parser_app blocks.csv - one row per block (docs chapter 4.9)

[btc:transactions]
INDEXED_EXTRACTIONS = csv
HEADER_FIELD_LINE_NUMBER = 1
FIELD_DELIMITER = ,
FIELD_QUOTE = "
TIMESTAMP_FIELDS = block_time
TIME_FORMAT = %s
TZ = UTC
SHOULD_LINEMERGE = false
category = Structured
description = btc_parser_app transactions.csv - one row per transaction (docs chapter 4.10)

[btc:inputs]
INDEXED_EXTRACTIONS = csv
HEADER_FIELD_LINE_NUMBER = 1
FIELD_DELIMITER = ,
FIELD_QUOTE = "
TIMESTAMP_FIELDS = block_time
TIME_FORMAT = %s
TZ = UTC
SHOULD_LINEMERGE = false
category = Structured
description = btc_parser_app inputs.csv - one row per vin (docs chapter 4.11)

[btc:outputs]
INDEXED_EXTRACTIONS = csv
HEADER_FIELD_LINE_NUMBER = 1
FIELD_DELIMITER = ,
FIELD_QUOTE = "
TIMESTAMP_FIELDS = block_time
TIME_FORMAT = %s
TZ = UTC
SHOULD_LINEMERGE = false
category = Structured
description = btc_parser_app outputs.csv - one row per vout (docs chapter 4.12)

[btc:stale_block_headers]
INDEXED_EXTRACTIONS = csv
HEADER_FIELD_LINE_NUMBER = 1
FIELD_DELIMITER = ,
FIELD_QUOTE = "
TIMESTAMP_FIELDS = observed_at
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
TZ = UTC
SHOULD_LINEMERGE = false
category = Structured
description = btc_parser_app stale_block_headers.csv - non-active chain tips (docs chapter 5.6)

[btc:prices]
INDEXED_EXTRACTIONS = csv
HEADER_FIELD_LINE_NUMBER = 1
FIELD_DELIMITER = ,
FIELD_QUOTE = "
TIMESTAMP_FIELDS = date_unix
TIME_FORMAT = %s
TZ = UTC
SHOULD_LINEMERGE = false
category = Structured
description = live-polled + Kraken-imported BTC/USD/EUR minute prices (docs chapter 6.4/6.6) - date_unix is the price's own timestamp, not the poll time
