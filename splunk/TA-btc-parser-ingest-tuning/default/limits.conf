# TA-btc-parser-ingest-tuning/default/limits.conf
#
# Deploy on the instance that READS the files. Needs a restart.

[thruput]
# A Universal Forwarder throttles itself to 256 KB/s by default - that
# alone would stretch a multi-TB backfill to months. 0 = unlimited.
# (Splunk Enterprise already defaults to 0; harmless there.)
maxKBps = 0
