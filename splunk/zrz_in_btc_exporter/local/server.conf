# zrz_in_btc_exporter/local/server.conf
#
# Use Case btc - wirkt auf der Instanz, die die Dateien LIEST (UF des
# Parser-Hosts; im Test die Standalone-Instanz, die zugleich indexiert).
# Neustart noetig. Fuer den Indexer-Cluster sind diese Werte eine
# Plattform-Entscheidung (global fuer alle Use Cases) und NICHT Teil von
# zrz_ix_btc - siehe docs/12-splunk-backfill-indexierung.md 12.2/12.4.

[general]
# Independent pipeline sets (input -> parsing -> indexing), each with its
# own threads and its own hot buckets. Splunk's default is 1, i.e. one
# core's worth of parsing/indexing no matter how big the box is. Each set
# costs roughly 1-1.5 cores plus memory for its queues; on a 16-core/32-
# thread host that also runs bitcoind + rpc-ingest, 4 is a good start and
# 6 the sensible maximum. Watch the Monitoring Console (Indexing ->
# Performance) - if the queues of every set are full ("blocked") at the
# indexer, more sets won't help; if they're idle, go up.
parallelIngestionPipelines = 4

[queue]
# Default 500KB per queue. Bigger buffers smooth bursts between the
# pipeline stages (a 900 MB part being read vs. a bucket roll) instead of
# blocking the reader. Memory is cheap here: queues x pipeline sets x 32MB.
maxSize = 32MB
