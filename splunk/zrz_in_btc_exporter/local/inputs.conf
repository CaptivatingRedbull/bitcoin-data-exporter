# zrz_in_btc_exporter/local/inputs.conf
#
# Use Case btc - Input-App fuer den Universal Forwarder, verteilt ueber den
# Deployment-Server (Serverklasse zrz_btc_exporter, App zrz_ds_btc) NUR auf
# den UF des Hosts, auf dem parser-data/ liegt (bzw. gemountet ist). Nie auf
# Indexer/Search Heads. Test-Standalone: direkt nach
# $SPLUNK_HOME/etc/apps/ der Enterprise-Instanz kopieren.
#
# Hier steht nur, WELCHE Dateien gelesen werden und wie. Sourcetype-Parsing
# (Zeitstempel, indizierte Felder) liegt in zrz_ko_btc (Index-Time) bzw.
# zrz_rd_btc (Search-Time) - siehe docs/10-splunk-integration-und-feldkonzept.md.
#
# TODO vor dem Deployment: jedes $PARSER_DATA_ROOT unten durch den echten
# absoluten Pfad des parser-data/-Export-Roots auf diesem Host ersetzen
# (rpc.output_dir / mempool_api.output_dir / stale_blocks.output_dir /
# mempool_watch.output_dir in config/config.yaml bzw.
# config/config.production.yaml - die haben nicht in jeder Umgebung einen
# gemeinsamen Parent, also die echten Werte pruefen). Nie auf ein state_dir
# zeigen - siehe docs/07-ausgabedateien-und-datenaufnahme.md 7.4/7.5.
#
# crcSalt = <SOURCE> auf jeder Stanza: Splunks "schon gesehen?"-Pruefung
# hasht nur die ersten/letzten paar hundert Byte. Jeder Part einer CSV
# beginnt mit derselben Kopfzeile (Kapitel 7.6) - ohne crcSalt kann Splunk
# einen neuen Part fuer einen bereits konsumierten halten und ihn
# stillschweigend ueberspringen. <SOURCE> nimmt den vollen Pfad (inkl.
# Part-Nummer) in den Hash.

# --- export/rpc/ : a part only ever appears here once it is fully
# written (chapter 4.6) - never a growing file - so `batch`
# (consume-and-delete) is safe here and nowhere else in this layout. ---

[batch://$PARSER_DATA_ROOT/export/rpc/blocks/blocks*.csv]
move_policy = sinkhole
sourcetype = zrz:btc:blocks
index = zrz_btc
crcSalt = <SOURCE>

[batch://$PARSER_DATA_ROOT/export/rpc/transactions/transactions*.csv]
move_policy = sinkhole
sourcetype = zrz:btc:transactions
index = zrz_btc
crcSalt = <SOURCE>

[batch://$PARSER_DATA_ROOT/export/rpc/inputs/inputs*.csv]
move_policy = sinkhole
sourcetype = zrz:btc:inputs
index = zrz_btc
crcSalt = <SOURCE>

[batch://$PARSER_DATA_ROOT/export/rpc/outputs/outputs*.csv]
move_policy = sinkhole
sourcetype = zrz:btc:outputs
index = zrz_btc
crcSalt = <SOURCE>

# --- export/api/, export/stale/ and export/mempool_watch/ : the current
# part keeps growing (chapter 3.2/5.5/11.6) - a `batch` input here would
# risk grabbing a file mid-write. `monitor` only, never `batch`. Rotated parts are never
# deleted by Splunk or by this application - clean them up by hand/cron
# once ingestion is confirmed (chapter 7.4). ---

[monitor://$PARSER_DATA_ROOT/export/api/prices*.csv]
sourcetype = zrz:btc:prices
index = zrz_btc
crcSalt = <SOURCE>

[monitor://$PARSER_DATA_ROOT/export/stale/stale_block_headers*.csv]
sourcetype = zrz:btc:stale_block_headers
index = zrz_btc
crcSalt = <SOURCE>

[monitor://$PARSER_DATA_ROOT/export/mempool_watch/sanctioned_tx_events*.csv]
sourcetype = zrz:btc:sanctioned_tx_events
index = zrz_btc
crcSalt = <SOURCE>
