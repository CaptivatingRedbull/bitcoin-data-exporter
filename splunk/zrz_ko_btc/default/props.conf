# Generated by tools/splunk/build_field_config.py from btc_parser_app/export_schema.py - edit those, not this file.
#
# zrz_ko_btc/default/props.conf - INDEX TIME.
#
# Install on the Splunk instance that READS the CSVs: the standalone test
# instance (parser, inputs and Splunk Enterprise on one host); the ZRZ
# rollout (CM + SHCD) is harmless there. It has no effect in prod
# (UF -> Cribl -> Splunk Enterprise): Cribl hands Splunk already-parsed
# events, so Splunk skips its parsing/typing for them - the same work is
# done by cribl/zrz_btc_pipeline.json there. Never install it on a
# Universal Forwarder: INDEXED_EXTRACTIONS would make the UF parse the small
# sourcetypes and ship every column to Cribl as an indexed field.
#
# Field concept (docs/10-splunk-integration-und-feldkonzept.md 10.6):
# - zrz:btc:blocks, zrz:btc:stale_block_headers, zrz:btc:sanctioned_tx_events,
#   zrz:btc:prices: INDEXED_EXTRACTIONS = csv, every column an indexed field.
# - zrz:btc:transactions, zrz:btc:inputs, zrz:btc:outputs: no
#   INDEXED_EXTRACTIONS. Classic line breaking, _time from the block_time
#   column by position, header row to nullQueue, and one WRITE_META transform
#   per indexed column (transforms.conf). Everything else is extracted at
#   search time by zrz_rd_btc. Column positions come from export_schema.py,
#   which tests/test_export_schema.py pins to the rows block_parser.py
#   writes.
#
# MAX_DAYS_AGO = 10951 (the maximum) on every sourcetype: the default
# of 2000 days would give every pre-2021 event a fallback _time.
# ANNOTATE_PUNCT = false: punct:: means nothing for CSV rows and costs
# index-time CPU and tsidx space on billions of events.

[zrz:btc:blocks]
INDEXED_EXTRACTIONS = csv
HEADER_FIELD_LINE_NUMBER = 1
FIELD_DELIMITER = ,
FIELD_QUOTE = "
TIMESTAMP_FIELDS = time
TIME_FORMAT = %s
TZ = UTC
SHOULD_LINEMERGE = false
MAX_DAYS_AGO = 10951
ANNOTATE_PUNCT = false
category = Structured
description = btc_parser_app blocks.csv - one row per block (docs chapter 4.9)

[zrz:btc:transactions]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^(?:[^,]*,){2}
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 10
TZ = UTC
MAX_DAYS_AGO = 10951
ANNOTATE_PUNCT = false
TRANSFORMS-zrz_btc_00_header = zrz_btc_drop_header_transactions
TRANSFORMS-zrz_btc_10_indexed = zrz_btc_idx_transactions_block_height, zrz_btc_idx_transactions_is_coinbase, zrz_btc_idx_transactions_version, zrz_btc_idx_transactions_vin_count, zrz_btc_idx_transactions_vout_count
category = Structured
description = btc_parser_app transactions.csv - one row per transaction (docs chapter 4.10)

[zrz:btc:inputs]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^(?:[^,]*,){2}
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 10
TZ = UTC
MAX_DAYS_AGO = 10951
ANNOTATE_PUNCT = false
TRANSFORMS-zrz_btc_00_header = zrz_btc_drop_header_inputs
TRANSFORMS-zrz_btc_10_indexed = zrz_btc_idx_inputs_block_height, zrz_btc_idx_inputs_is_coinbase, zrz_btc_idx_inputs_prevout_type, zrz_btc_idx_inputs_prevout_generated, zrz_btc_idx_inputs_relative_locktime_type
category = Structured
description = btc_parser_app inputs.csv - one row per vin (docs chapter 4.11)

