# TA-btc-parser-inputs/local/inputs.conf
#
# Deploy this app ONLY on the Universal Forwarder that runs on the host
# where parser-data/ actually lives (or is mounted) - never on an
# indexer/Splunk Cloud. It only tells the UF which files to read and how
# to consume them. Sourcetype assignment, timestamp extraction and field
# extraction are deliberately NOT set here - they live in
# TA-btc-parser-parsing/ instead, deployed on whichever tier actually
# parses events (see docs/10-splunk-integration-und-feldkonzept.md,
# section 2, for why that's a separate app/tier in the first place).
#
# Before deploying: replace every $PARSER_DATA_ROOT below with the actual
# absolute path to this host's parser-data/ export root (see
# rpc.output_dir / mempool_api.output_dir / stale_blocks.output_dir in
# config/config.yaml or config/config.production.yaml - they don't all
# share one common parent in every environment, so check the real values
# rather than assuming). Never point a stanza at a state_dir - see
# docs/07-ausgabedateien-und-datenaufnahme.md 7.4/7.5.
#
# crcSalt = <SOURCE> on every stanza: Splunk's default "have I already
# seen this file" check hashes only the first/last few hundred bytes of
# content. Every part file this application writes for a given CSV starts
# with the byte-for-byte identical header row (see chapter 7.6), so
# without crcSalt Splunk can mistake a genuinely new part for one it
# already consumed and deleted, and silently skip it. <SOURCE> folds the
# full file path into the hash instead, which is unique per part number.

# --- export/rpc/ : a part only ever appears here once it is fully
# written (chapter 4.6) - never a growing file - so `batch`
# (consume-and-delete) is safe here and nowhere else in this layout. ---

[batch://$PARSER_DATA_ROOT/export/rpc/blocks/blocks*.csv]
move_policy = sinkhole
sourcetype = btc:blocks
index = btc_parser
crcSalt = <SOURCE>

[batch://$PARSER_DATA_ROOT/export/rpc/transactions/transactions*.csv]
move_policy = sinkhole
sourcetype = btc:transactions
index = btc_parser
crcSalt = <SOURCE>

[batch://$PARSER_DATA_ROOT/export/rpc/inputs/inputs*.csv]
move_policy = sinkhole
sourcetype = btc:inputs
index = btc_parser
crcSalt = <SOURCE>

[batch://$PARSER_DATA_ROOT/export/rpc/outputs/outputs*.csv]
move_policy = sinkhole
sourcetype = btc:outputs
index = btc_parser
crcSalt = <SOURCE>

# --- export/api/ and export/stale/ : the current part keeps growing
# (chapter 3.2/5.5) - a `batch` input here would risk grabbing a file
# mid-write. `monitor` only, never `batch`. Rotated parts are never
# deleted by Splunk or by this application - clean them up by hand/cron
# once ingestion is confirmed (chapter 7.4). ---

[monitor://$PARSER_DATA_ROOT/export/api/prices*.csv]
sourcetype = btc:prices
index = btc_parser
crcSalt = <SOURCE>

[monitor://$PARSER_DATA_ROOT/export/stale/stale_block_headers*.csv]
sourcetype = btc:stale_block_headers
index = btc_parser
crcSalt = <SOURCE>
