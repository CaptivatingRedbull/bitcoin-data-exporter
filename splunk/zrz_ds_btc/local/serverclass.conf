# Regex replace Clientliste, mit Zeilenumbruch -> ,\s \n
##########################################
#
# Use Case btc: der UF auf dem Host, auf dem bitcoin-data-exporter laeuft
# (bzw. auf dem dessen parser-data/ liegt). Hostnamen in clients.txt
# eintragen - eine Zeile, kommagetrennt (siehe Regex oben).

[serverClass:zrz_btc_exporter]
whitelist.from_pathname = etc/apps/zrz_ds_btc/clients.txt

[serverClass:zrz_btc_exporter:app:zrz_in_btc_exporter]
restartSplunkWeb = 0
restartSplunkd = 1
stateOnClient = enabled

# Optional (nicht Teil dieses Repos): OS-Monitoring des Parser-Hosts ueber
# Splunk_TA_nix_btc (Vorlage Splunk_TA_nix_VORLAGE, Index zrz_btc_linux).
# [serverClass:zrz_btc_exporter:app:Splunk_TA_nix_btc]
# restartSplunkWeb = 0
# restartSplunkd = 1
# stateOnClient = enabled
