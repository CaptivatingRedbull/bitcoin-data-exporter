# Generated by splunk/dashboards/build_btc_mempool_explorer.py - edit that script, not this file.

[btc_rec_tx_values_update]
description = All-time transaction record values - hourly merge of the last hour of indexed data
search = `btc_index` sourcetype=btc:transactions is_coinbase=false `btc_rec_window` \
| stats max(fee_sats) as max_fee_sats max(fee_rate_sat_vb) as max_fee_rate max(vsize) as max_vsize max(vin_count) as max_vin max(vout_count) as max_vout max(input_age_max_blocks) as max_age max(coin_days_destroyed_btc) as max_cdd max(output_value_sats) as max_out \
    min(eval(if(fee_sats>0, fee_sats, null()))) as min_fee_sats min(eval(if(fee_sats>0, fee_rate_sat_vb, null()))) as min_fee_rate \
    count(eval(fee_sats==0)) as zero_fee_txs \
| append [| inputlookup btc_rec_tx_values] \
| fields - _key \
| stats max(max_fee_sats) as max_fee_sats max(max_fee_rate) as max_fee_rate max(max_vsize) as max_vsize max(max_vin) as max_vin max(max_vout) as max_vout max(max_age) as max_age max(max_cdd) as max_cdd max(max_out) as max_out min(min_fee_sats) as min_fee_sats min(min_fee_rate) as min_fee_rate sum(zero_fee_txs) as zero_fee_txs \
| outputlookup override_if_empty=false btc_rec_tx_values
enableSched = 1
cron_schedule = 15 * * * *
realtime_schedule = 0
dispatch.earliest_time = -7d@d
dispatch.latest_time = now

