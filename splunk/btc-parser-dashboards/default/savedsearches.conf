[btc_rec_io_update]
description = Largest single coin created / spent - hourly merge of the last hour of indexed data
search = `btc_index` (sourcetype=btc:outputs OR (sourcetype=btc:inputs is_coinbase=false)) `btc_rec_window` \
| stats max(value_sats) as v by sourcetype \
| where isnotnull(v) \
| map maxsearches=2 search="search `btc_index` sourcetype=$sourcetype$ `btc_rec_window` value_sats=$v$" \
| eval kind=if(sourcetype=="btc:outputs", "created", "spent"), addr=coalesce(address, prevout_address), io=coalesce(output_index, input_index), t=_time \
| table kind t block_height txid io addr value_sats input_age_blocks \
| append [| inputlookup btc_rec_io] \
| fields - _key \
| where isnotnull(value_sats) \
| eventstats max(value_sats) as m by kind \
| where value_sats==m \
| dedup kind txid io \
| fields - m \
| outputlookup override_if_empty=false btc_rec_io
enableSched = 1
cron_schedule = 15 * * * *
realtime_schedule = 0
dispatch.earliest_time = -7d@d
dispatch.latest_time = now

