# TA-btc-parser-indexes/default/indexes.conf
#
# Deploy on the INDEXER (the Splunk Enterprise instance that writes the
# buckets) - not on a Universal Forwarder. See
# docs/12-splunk-backfill-indexierung.md.
#
# Why this file exists at all: the btc_parser data is *historic*. Block
# timestamps start at 2009-01-03, and Splunk's index defaults assume
# recently generated log data:
#   - frozenTimePeriodInSecs default 188697600 (6 years): every bucket whose
#     newest event is older than that is frozen - i.e. DELETED, since no
#     coldToFrozenDir is set - right after it rolls. A full-chain backfill
#     with defaults silently throws away 2009 - ~2020.
#   - quarantinePastSecs default 77760000 (900 days): events older than
#     that go to a separate quarantine bucket instead of the normal hot
#     buckets - for this data, almost everything.
#   - maxTotalDataSizeMB default 500000 (~488 GB): once exceeded, the oldest
#     buckets are frozen (deleted) to make room. The whole chain is well
#     beyond that.
#
# Precedence: if the btc_parser index was already created elsewhere (e.g.
# via Splunk Web, which writes etc/apps/search/local/indexes.conf), that
# definition's *paths* win over the ones below (local beats default) and
# only the attributes not set there are taken from here. Run
#   $SPLUNK_HOME/bin/splunk btool indexes list btc_parser --debug
# to see which file each effective value comes from - any of the
# retention values below that is overridden there must be fixed THERE.

[btc_parser]
homePath   = $SPLUNK_DB/btc_parser/db
coldPath   = $SPLUNK_DB/btc_parser/colddb
thawedPath = $SPLUNK_DB/btc_parser/thaweddb

# ~50 years: never freeze by age. Genesis (2009) must stay searchable.
frozenTimePeriodInSecs = 1576800000
# Same horizon, so historic events go to normal buckets, not quarantine.
quarantinePastSecs = 1576800000

# Size cap for the whole index (hot+warm+cold). MUST be larger than what
# the backfill will produce, or Splunk deletes the oldest buckets to stay
# under it. 6 TB here; lower/raise to what the SPLUNK_DB volume can really
# hold (rule of thumb with INDEXED_EXTRACTIONS: indexed size ~ 0.6-1.2x the
# raw CSV size - check after the first hours, see docs chapter 12).
maxTotalDataSizeMB = 6291456

# 10 GB buckets (the high-volume setting) instead of 750 MB: far fewer
# bucket rolls and far fewer buckets for billions of events.
maxDataSize = auto_high_volume

# Several sourcetypes/files covering different years are indexed in
# parallel; with the small default, Splunk keeps rolling hot buckets every
# time an event falls outside the time span of the open ones.
maxHotBuckets = 10

# Most compact tsidx format (Splunk 8.1+ default on new installs is 3 or 4
# depending on version; set explicitly).
tsidxWritingLevel = 4
